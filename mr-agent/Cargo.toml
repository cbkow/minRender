[package]
name = "mr-agent"
version = "0.5.11"
edition = "2021"
description = "MinRender headless render agent"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
simplelog = "0.12"
regex = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Foundation",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Embeds icon + VERSIONINFO into mr-agent.exe (see build.rs). Metadata-less
# Rust binaries are prime Defender false-positive bait (Bearfoos/Wacatac !ml).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
